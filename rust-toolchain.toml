[toolchain]
# Pinned so local builds and CI resolve identically.
#
# This was 1.86.0, which the committed Cargo.lock had drifted past: several locked
# dependencies now require rustc >= 1.88, so `cargo` refused to resolve the graph
# and every job that compiled Rust failed before doing any work. When bumping this,
# re-run the full suite -- the lockfile floats, the pin does not.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# `wasm32v1-none`, not `wasm32-unknown-unknown`. The default wasm32-unknown-unknown
# target emits the `reference-types` feature, and the Soroban host rejects any
# module carrying it:
#     reference-types not enabled: zero byte expected
# so contracts built for wasm32-unknown-unknown cannot be uploaded, let alone
# deployed. wasm32v1-none is WASM 1.0, which is what the host accepts.
targets = ["wasm32v1-none"]
profile = "minimal"
