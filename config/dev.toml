# Development environment — local Stellar quickstart + Soroban RPC
[env]
name = "dev"
stellar_network = "local"
horizon_url = "http://localhost:8000"
soroban_rpc_url = "http://localhost:8001"
soroban_network_passphrase = "Standalone Network ; February 2017"

# Contract deployment defaults for dev
[deploy]
auto_fund = true
fee = "100"
timeout_seconds = 30
confirmations = 1

