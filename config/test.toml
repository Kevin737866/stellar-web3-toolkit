# Testnet environment — Stellar Testnet
[env]
name = "test"
stellar_network = "testnet"
horizon_url = "https://horizon-testnet.stellar.org"
soroban_rpc_url = "https://soroban-testnet.stellar.org"
soroban_network_passphrase = "Test SDF Network ; September 2015"

[deploy]
auto_fund = true
fee = "1000"
timeout_seconds = 60
confirmations = 2

# Feature flags for testnet monitoring
[monitoring]
enabled = true
poll_interval_seconds = 30
alert_on_failure = true
horizon_poll_url = "https://horizon-testnet.stellar.org/accounts"
