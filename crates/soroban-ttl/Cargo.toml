[package]
name = "soroban-ttl"
version.workspace = true
edition.workspace = true
publish = false
description = "Reusable Soroban storage TTL (time-to-live) auto-extension helpers for the Stellar Web3 Toolkit"
license.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
