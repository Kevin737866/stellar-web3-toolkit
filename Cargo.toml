[workspace]
members = [
    "crates/contract-proptests",
    "crates/stellar-toolkit",
    "crates/stellar-did",
    "crates/payment-channel",
    "crates/channel-router",
    "crates/watchtower",
    "crates/channel-simulator",
    "crates/atomic-swap",
    "contracts/payment-channel-contract",
    "contracts/amm-pool",
    "contracts/amm-factory",
    "contracts/amm-router",
    "contracts/delegated-staking",
    "contracts/htlc-contract",
    "contracts/nft-sft-contract",
    "contracts/collection-access-control",
    "contracts/nft-drop",
    "contracts/marketplace-contract",
    "contracts/royalty-splitter",
    "contracts/rwa-fractionalizer",
    "contracts/airdrop-merkle",
    "contracts/token-locker",
    "contracts/bridge-pause-guard",
    "contracts/yield-farm",
]

resolver = "2"

[workspace.dependencies]
soroban-sdk = "21.4.0"
stellar-xdr = "21.0.0"

# Payment Channel Dependencies
sha2 = "0.10.8"
hmac = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonical = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
priority-queue = "1.3"
fxhash = "0.2"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
once_cell = "1.19"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# DID Dependencies
ed25519-dalek = "2.1.0"
base64 = "0.21"
url = "2.4"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-graphql = "7.0"
async-graphql-axum = "7.0"
json-ld = "0.16"

# Lint policy (issue #186).
#
# Pedantic lints are enabled for every crate through `[lints] workspace = true`
# in the member manifests, so `cargo clippy -- -D warnings` enforces them in CI
# instead of the pass being an occasional manual sweep.
#
# The allow-list below is deliberately narrow and each entry names why the lint
# does not pay for itself here. Everything else pedantic is a hard error.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Lower priority than the individual lints below, so an `allow` for one lint
# wins over the group it belongs to.
pedantic = { level = "warn", priority = -1 }
# Contract entry points and storage helpers take owned `soroban_sdk` values by
# design: the SDK decodes them into owned values and the wasm ABI has no
# borrows, so `&T` would only add a copy at the call site.
needless_pass_by_value = "allow"
# `#[must_use]` on every `&self` getter is noise: this workspace has hundreds of
# them and the compiler already warns on an unused `Result`.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Panics in these crates are either `assert!` in tests or an explicit abort in a
# contract, both already documented where they matter.
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# Numeric conversion lints fire on the arithmetic these contracts are made of.
# Every one is audited in `docs/THREAT_MODEL.md`; the blanket allows keep the
# signal on lints that indicate a real bug.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Module-qualified names (`policy::FeePolicy`) are the naming convention here.
module_name_repetitions = "allow"
# Test fixtures legitimately shadow and mirror names.
similar_names = "allow"
many_single_char_names = "allow"
# Long test bodies read better as one flow than as helpers with parameters.
too_many_lines = "allow"
# Used by `ChannelManager`, which holds a lock guard for the whole call.
unused_self = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kevin737866/stellar-web3-toolkit"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
