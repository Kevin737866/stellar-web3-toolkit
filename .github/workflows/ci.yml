name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, develop ]
  merge_group:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Run Clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # wasm32v1-none has no std, so the host-only crates cannot be built for it;
          # only the deployable contracts are. `stellar-did` is a host crate too
          # (axum/tokio), and `contract-proptests` is a std test harness, so both
          # are excluded alongside the others.
          - target: wasm32v1-none
            command: >-
              cargo build --workspace
              --exclude stellar-toolkit --exclude stellar-did
              --exclude payment-channel
              --exclude channel-router --exclude channel-simulator
              --exclude watchtower --exclude atomic-swap
              --exclude contract-proptests
              --target wasm32v1-none --release
          - target: x86_64-unknown-linux-gnu
            command: cargo build --all --release --target x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: ${{ matrix.command }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Run tests
        run: cargo test --all --all-features -- --nocapture
      - name: Run doc tests
        run: cargo test --doc --all

  proptest:
    name: Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Contract property suite (seeded)
        # `contract-proptests` is a std harness the wasm builds exclude; it carries
        # the randomized operation-sequence invariants for the contracts.
        env:
          PROPERTY_CASES: "1024"
          PROPERTY_SEED: "20260929"
        run: cargo test -p contract-proptests --all-features -- --nocapture
      - name: Contract property suite (second seed)
        # A different seed explores a different slice of the input space; a
        # property that only holds for one stream is not a property.
        env:
          PROPERTY_CASES: "512"
          PROPERTY_SEED: "1"
        run: cargo test -p contract-proptests --all-features -- --nocapture

  simulation:
    name: Network Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Run simulation tests
        run: cargo test --package channel-simulator -- --nocapture
      - name: Run routing benchmarks
        # `--test '*'` selects integration-test targets, and channel-router has no
        # `tests/` directory, so the glob matched nothing and cargo exited non-zero.
        # Its tests are unit tests inside the crate.
        run: cargo test --package channel-router --lib -- --nocapture

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit || true
      - name: Run security audit
        run: cargo audit || echo "Audit complete"

  wasm:
    name: Build WASM Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-contracts
      - name: Build all contracts (reproducible)
        run: |
          echo "Building all Soroban contracts to WASM (release, reproducible)..."
          cargo build --workspace --exclude stellar-toolkit --exclude stellar-did --exclude payment-channel --exclude channel-router --exclude channel-simulator --exclude watchtower --exclude atomic-swap --exclude contract-proptests --target wasm32v1-none --release
          # Fallback: ensure explicit contract packages built
          cargo build -p payment-channel-contract -p htlc-contract -p amm-pool -p amm-factory -p amm-router --target wasm32v1-none --release || true
          ls -lh target/wasm32v1-none/release/*.wasm || echo "No wasm artifacts found in target"
          sha256sum target/wasm32v1-none/release/*.wasm > wasm-checksums.txt || true
          cat wasm-checksums.txt
      - name: Verify the built WASM loads in the Soroban host
        run: |
          # The only check that exercises module *validation* rather than
          # compilation. Without it this job would happily ship contracts that the
          # Soroban host rejects, which is exactly what a wrong WASM target does.
          set -o pipefail
          out="$(cargo test -p amm-factory --lib create_pair_deploys_pool -- --nocapture 2>&1)"
          echo "$out"
          # The test self-skips when the artifact is missing; treat that as a failure
          # here, because by this point in the job the artifact must exist.
          if grep -q "skip create_pair_deploys_pool" <<<"$out"; then
            echo "::error::amm_pool.wasm was not found or the test self-skipped"
            exit 1
          fi
      - name: Verify reproducibility (second build hash check)
        run: |
          cp wasm-checksums.txt wasm-checksums-1.txt
          cargo build --workspace --exclude stellar-toolkit --exclude stellar-did --exclude payment-channel --exclude channel-router --exclude channel-simulator --exclude watchtower --exclude atomic-swap --exclude contract-proptests --target wasm32v1-none --release
          sha256sum target/wasm32v1-none/release/*.wasm > wasm-checksums-2.txt || true
          diff -u wasm-checksums-1.txt wasm-checksums-2.txt && echo "Reproducibility check passed" || echo "Reproducibility drift detected (check build determinism)"
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: |
            target/wasm32v1-none/release/*.wasm
            wasm-checksums.txt
          retention-days: 14
      - name: Upload WASM checksums for verification
        uses: actions/upload-artifact@v4
        with:
          name: wasm-checksums
          path: wasm-checksums.txt
          retention-days: 30

  wasm-verify:
    name: Verify Bytecode (Reproducible Build)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: wasm-checksums
      - name: Display checksums
        run: cat wasm-checksums.txt

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Generate documentation
        run: cargo doc --all --no-deps
        continue-on-error: true
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc/
          retention-days: 7

  automated-checks:
    name: "Codegen, Env, Security & Invariant Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the workspace toolchain: 1.86.0 could not resolve the
          # committed lockfile, so this job failed before running anything.
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: TypeScript client codegen checks (import dedup, bigint mapping)
        run: cargo run -p stellar-toolkit -- codegen check
      - name: Monitoring snapshot + restore checksum verification
        run: |
          cargo run -p stellar-toolkit -- monitoring dashboard --output target/monitoring
          cargo run -p stellar-toolkit -- monitoring restore --snapshot target/monitoring
      - name: Environment configs (dev/test/prod) validate
        # Issue #118: refuses a config whose passphrase, endpoints and safety
        # flags disagree with each other or with the environment it names.
        run: cargo run -p stellar-toolkit -- env validate
      - name: Secret material scan
        # Issue #115: fails when a secret key, recovery phrase or real .env is
        # committed. Findings are masked, so the log cannot leak what it found.
        run: cargo run -p stellar-toolkit -- security secrets
      - name: Informal verification invariants
        # Issue #116: sampled search for counterexamples to the stated
        # invariants; the seed is pinned so a failure is reproducible.
        run: cargo run -p stellar-toolkit -- verify invariants --iterations 512

  merge-check:
    name: Merge Queue Check
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Quick build check
        run: cargo build --all --quiet
      - name: Quick test check
        run: cargo test --all --quiet
