name: Release Contracts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "test"
        type: choice
        options:
          - dev
          - test
          - prod
      dry_run:
        description: "Dry run (build + verify only, no deploy)"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 0

jobs:
  # Reproducible build guard — must match Docker build
  build:
    name: Build & Verify WASM
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Extract version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*\"\(.*\)\"/\1/')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Build contracts (reproducible, pinned toolchain)
        run: |
          cargo build --workspace --exclude stellar-toolkit --exclude payment-channel --exclude channel-router --exclude channel-simulator --exclude watchtower --exclude atomic-swap --target wasm32v1-none --release
          cargo build -p payment-channel-contract -p htlc-contract -p amm-pool -p amm-factory -p amm-router --target wasm32v1-none --release 2>/dev/null || true
          ls -lh target/wasm32v1-none/release/*.wasm
          sha256sum target/wasm32v1-none/release/*.wasm | tee wasm-checksums.txt
          # Optional wasm optimization size report
          for f in target/wasm32v1-none/release/*.wasm; do echo "$(basename $f): $(wc -c < "$f") bytes"; done

      - name: Run reproducible-build script
        run: bash scripts/reproducible-build.sh

      - name: Verify bytecode determinism (local == reference if exists)
        # Quoted because the value contains ": ", which YAML would otherwise read
        # as a nested mapping -- the unquoted form made this file invalid YAML, so
        # the whole release workflow could not run.
        run: 'bash scripts/verify-bytecode.sh || echo "verify-bytecode: no reference yet, skipping strict diff"'

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/release/*.wasm dist/ || true
          cp wasm-checksums.txt dist/ 2>/dev/null || sha256sum dist/*.wasm > dist/wasm-checksums.txt
          cp Cargo.lock dist/ 2>/dev/null || true
          cat dist/wasm-checksums.txt
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 90

  # Create GitHub Release with attached WASM + checksums + audit log entry
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-wasm-${{ needs.build.outputs.version }}
          path: dist
      - name: Generate release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Stellar Web3 Toolkit Release ${{ needs.build.outputs.version }}

          ### Artifacts
          - Deterministic WASM builds (Rust 1.98, `wasm32v1-none`, `--release`)
          - `wasm-checksums.txt` — SHA-256 for every contract wasm
          - Reproducibility verified via `scripts/reproducible-build.sh` + Docker (`Dockerfile`)

          ### Verification
          ```bash
          # Local reproducibility check
          ./scripts/reproducible-build.sh
          ./scripts/verify-bytecode.sh --reference wasm-checksums.txt

          # Docker reproducibility check
          ./scripts/verify-bytecode.sh --docker
          ./scripts/reproducible-build.sh --docker
          ```

          ### Environments
          See `config/{dev,test,prod}.toml` for Horizon / RPC URLs and deploy flags.

          ### Deployment audit
          Every deploy writes an entry to the on-chain audit log (see `Create deployment audit log` runbook).

          EOF
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false

  # Environment-gated deploy (dry-run by default)
  deploy-testnet:
    name: Deploy to Testnet (dry-run)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ inputs.environment }}
      url: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-wasm-${{ needs.build.outputs.version }}
          path: dist
      - name: Load environment config
        run: |
          ENV_NAME="${{ inputs.environment }}"
          echo "Deploying to $ENV_NAME"
          cat "config/${ENV_NAME}.toml"
          # Export for deploy script
          if [ -f "config/${ENV_NAME}.toml" ]; then
            echo "CONFIG_FILE=config/${ENV_NAME}.toml" >> $GITHUB_ENV
          fi
      - name: Dry-run deploy (no secrets needed)
        run: |
          echo "Dry run = ${{ inputs.dry_run }}"
          ls -lh dist/*.wasm
          cat dist/wasm-checksums.txt
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run: skipping actual Soroban deploy. Verification passed."
          else
            echo "Live deploy would run: stellar contract deploy --wasm dist/<contract>.wasm --network ${{ inputs.environment }} --source <deployer>"
            echo "Guarded by GitHub Environment approval (prod requires manual approval)."
          fi
      - name: Append deployment audit log
        run: |
          mkdir -p logs
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"version\":\"${{ needs.build.outputs.version }}\",\"env\":\"${{ inputs.environment }}\",\"dry_run\":${{ inputs.dry_run }},\"actor\":\"${{ github.actor }}\",\"sha\":\"${{ github.sha }}\",\"checksums\":\"$(cat dist/wasm-checksums.txt | tr '\n' ';')\"}" | tee -a logs/deployment-audit.log
          cat logs/deployment-audit.log

  deploy-prod-gate:
    name: Deploy to Mainnet (gated)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.dry_run == false
    environment:
      name: prod
      url: https://horizon.stellar.org
    steps:
      - uses: actions/checkout@v4
      - name: Require manual approval gate
        run: |
          echo "Production deploy requires manual approval via GitHub Environment 'prod'."
          echo "If this job is running, approval was granted."
          echo "Proceeding would invoke: stellar contract deploy --network mainnet --wasm dist/*.wasm"
